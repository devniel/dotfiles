general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/dark-minimal.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.7
}

label {
    monitor =
    text = $TIME
    color = rgba(215, 218, 224, 1.0)
    font_size = 96
    font_family = Inter
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(125, 133, 144, 1.0)
    font_size = 20
    font_family = Inter
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(35, 40, 51, 1.0)
    inner_color = rgba(18, 21, 28, 0.9)
    font_color = rgba(215, 218, 224, 1.0)
    check_color = rgba(122, 162, 247, 1.0)
    fail_color = rgba(247, 118, 142, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##7d8590">Password</span>
    rounding = 12
    position = 0, -20
    halign = center
    valign = center
}
