source = ~/.config/hypr/monitors.conf

$mod = SUPER
$terminal = kitty
$menu = wofi --show drun

env = XCURSOR_SIZE,24
env = GDK_SCALE,2

xwayland {
    force_zero_scaling = true
}

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/libexec/hyprpolkitagent
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 1
    col.active_border = rgba(7aa2f7ff)
    col.inactive_border = rgba(232833ff)
    layout = dwindle
}

dwindle {
    preserve_split = true
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 5
        passes = 2
        noise = 0.02
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.8, 0.25, 1
    animation = windows, 1, 4, smooth, popin 92%
    animation = fade, 1, 4, smooth
    animation = workspaces, 0
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# macOS-style Spaces: 4-finger horizontal swipe slides between whole workspaces
gesture = 4, horizontal, workspace

misc {
    disable_hyprland_logo = true
    background_color = rgb(0b0d12)
}

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, SPACE, exec, $menu
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, L, exec, loginctl lock-session
bind = $mod SHIFT, E, exit

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Switch whole spaces (same keys as GNOME)
bind = CTRL ALT, right, workspace, e+1
bind = CTRL ALT, left, workspace, e-1

# Move the focused window to the next/previous space
bind = CTRL ALT SHIFT, right, movetoworkspace, e+1
bind = CTRL ALT SHIFT, left, movetoworkspace, e-1

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

bind = $mod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod, P, exec, hyprpicker -a
bind = $mod, E, exec, nautilus
bind = $mod, A, exec, pavucontrol

# More spaces
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# New space: jump to the first empty workspace, optionally carrying the focused window
bind = $mod, N, workspace, empty
bind = $mod SHIFT, N, movetoworkspace, empty

# Overview (hyprexpo): Mission Control style grid of spaces. Click a space to go there,
# drag a window from one space onto another to move it. Toggle with Super+Tab or a 4-finger swipe up.
plugin = /home/devniel/.local/lib/hyprexpo/hyprexpo.so

plugin {
    hyprexpo {
        columns = 3
        gaps_in = 8
        bg_col = rgb(0b0d12)
        workspace_method = center current
        drag_drop_enable = 1
    }
}

bind = $mod, TAB, hyprexpo:expo, toggle
gesture = 4, up, dispatcher, hyprexpo:expo, toggle
