# --- Font ---
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
disable_ligatures never

# --- Window (Hyprland draws the frame) ---
hide_window_decorations yes
window_padding_width    10
remember_window_size    no
confirm_os_window_close 0
enable_audio_bell       no
background_opacity      0.94
window_border_width     1pt
active_border_color     #7aa2f7
inactive_border_color   #232833

# --- Cursor and selection ---
cursor_shape      beam
cursor_blink_interval 0
copy_on_select    clipboard
mouse_hide_wait   3.0

# --- Scrollback ---
scrollback_lines 20000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# --- Shell and remote control ---
shell_integration enabled
allow_remote_control socket-only
listen_on unix:@kitty

# --- Tabs ---
tab_bar_edge     top
tab_bar_style    fade
tab_fade         1
tab_title_template " {index}: {title} "
active_tab_foreground   #0b0d12
active_tab_background   #7aa2f7
inactive_tab_foreground #7d8590
inactive_tab_background #12151c
tab_bar_background      #0b0d12

# --- Layouts: splits inside a window, stack to zoom one pane ---
enabled_layouts splits,stack

# --- Colors: dark minimal ---
foreground            #d7dae0
background            #0b0d12
selection_foreground  #d7dae0
selection_background  #1f2a44
cursor                #7aa2f7
url_color             #7aa2f7

color0  #15161e
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #a9b1d6
color15 #c0caf5

# --- Keys ---
map ctrl+shift+t          new_tab_with_cwd
map ctrl+shift+enter      launch --location=split  --cwd=current
map ctrl+shift+backslash  launch --location=vsplit --cwd=current
map ctrl+shift+minus      launch --location=hsplit --cwd=current
map ctrl+shift+f          toggle_layout stack
map ctrl+shift+left       neighboring_window left
map ctrl+shift+right      neighboring_window right
map ctrl+shift+up         neighboring_window up
map ctrl+shift+down       neighboring_window down
map ctrl+shift+equal      change_font_size all +1.0
map ctrl+shift+plus       change_font_size all +1.0
map ctrl+shift+backspace  change_font_size all 0
map ctrl+alt+minus        change_font_size all -1.0
map ctrl+alt+equal        change_font_size all +1.0
map ctrl+alt+plus         change_font_size all +1.0
